<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morocco Prayer Times</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Prayer Times</h1>
  </header>

  <div class="city-container">
    <!-- Repeat this block for each city, matching the exact ID -->
    <div class="city-card" id="Agadir">
      <h2>Agadir</h2>
      <div class="times">
        <div class="time-row"><span>Fajr</span> <span class="val-fajr">--:--</span></div>
        <div class="time-row"><span>Sunrise</span> <span class="val-sunrise">--:--</span></div>
        <div class="time-row"><span>First Third</span> <span class="val-firstthird">--:--</span></div>
        <div class="time-row"><span>Last Third</span> <span class="val-lastthird">--:--</span></div>
      </div>
    </div>
    
    <div class="city-card" id="Kenitra">...</div>
    <div class="city-card" id="Rabat">...</div>
    <div class="city-card" id="Tetouan">...</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
