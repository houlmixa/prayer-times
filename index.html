<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morocco Prayer Times</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- 1. Link the manifest -->
  <link rel="manifest" href="manifest.json">
  <!-- Safari iOS specific tag for the icon -->
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <!-- 2. Register the service worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Notice the ./ here too!
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered', reg))
          .catch(err => console.error('Service Worker failure', err));
      });
    }
  </script>
</head>
<body>

  <header>
    <h1>Prayer Times</h1>
  </header>

  <div class="city-container">
    <!-- Repeat this block for each city, matching the exact ID -->
    <div class="city-card" id="Agadir">
      <h2>Agadir</h2>
      <div class="times">
        <div class="time-row"><span>Fajr</span> <span class="val-fajr">--:--</span></div>
        <div class="time-row"><span>Sunrise</span> <span class="val-sunrise">--:--</span></div>
        <div class="time-row"><span>Last Third</span> <span class="val-lastthird">--:--</span></div>
      </div>
    </div>
    
    <div class="city-card" id="Kenitra">
       <h2>Kenitra</h2>
      <div class="times">
        <div class="time-row"><span>Fajr</span> <span class="val-fajr">--:--</span></div>
        <div class="time-row"><span>Sunrise</span> <span class="val-sunrise">--:--</span></div>
        <div class="time-row"><span>Last Third</span> <span class="val-lastthird">--:--</span></div>
      </div>
    </div>
    <div class="city-card" id="Rabat">
     <h2>Rabat</h2>
      <div class="times">
        <div class="time-row"><span>Fajr</span> <span class="val-fajr">--:--</span></div>
        <div class="time-row"><span>Sunrise</span> <span class="val-sunrise">--:--</span></div>
        <div class="time-row"><span>Last Third</span> <span class="val-lastthird">--:--</span></div>
      </div>  
    </div>
    <div class="city-card" id="Tetouan">
     <h2>Tetouan</h2>
      <div class="times">
        <div class="time-row"><span>Fajr</span> <span class="val-fajr">--:--</span></div>
        <div class="time-row"><span>Sunrise</span> <span class="val-sunrise">--:--</span></div>
        <div class="time-row"><span>Last Third</span> <span class="val-lastthird">--:--</span></div>
      </div>  
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
